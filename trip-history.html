<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trip History - Kovilpatti Logistics</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f5f7fa;
      min-height: 100vh;
    }
    
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px 30px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }
    
    .header h1 {
      font-size: 24px;
    }
    
    .btn-back {
      background: rgba(255,255,255,0.2);
      color: white;
      border: 2px solid white;
      padding: 8px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      text-decoration: none;
      transition: all 0.3s;
    }
    
    .btn-back:hover {
      background: white;
      color: #667eea;
    }
    
    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }
    
    .trips-card {
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    
    .filter-bar {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }
    
    .filter-bar select,
    .filter-bar input {
      padding: 10px 15px;
      border: 2px solid #e1e8ed;
      border-radius: 8px;
      font-size: 14px;
    }
    
    .filter-bar select {
      flex: 0 0 200px;
    }
    
    .filter-bar input {
      flex: 1;
      min-width: 200px;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
    }
    
    thead {
      background: #f8f9fa;
    }
    
    th, td {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
    }
    
    th {
      font-weight: 600;
      color: #666;
      font-size: 14px;
    }
    
    td {
      color: #333;
    }
    
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    
    .status-delivered, .status-completed {
      background: #d1fae5;
      color: #065f46;
    }
    
    .status-in-transit {
      background: #fef3c7;
      color: #92400e;
    }
    
    .status-pending {
      background: #dbeafe;
      color: #1e40af;
    }
    
    .status-cancelled {
      background: #fee2e2;
      color: #991b1b;
    }
    
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #999;
    }
    
    .loading-state {
      text-align: center;
      padding: 60px 20px;
      color: #667eea;
    }
    
    @media (max-width: 768px) {
      table {
        font-size: 13px;
      }
      
      th, td {
        padding: 8px 4px;
      }
      
      .filter-bar {
        flex-direction: column;
      }
      
      .filter-bar select,
      .filter-bar input {
        flex: 1;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>📋 Your Trip History</h1>
    <a href="?page=dashboard" class="btn-back">← Back to Dashboard</a>
  </div>
  
  <div class="container">
    <div class="trips-card">
      <div class="filter-bar">
        <select id="statusFilter" onchange="loadTrips()">
          <option value="All">All Status</option>
          <option value="Pending">Pending</option>
          <option value="Confirmed">Confirmed</option>
          <option value="In-Transit">In-Transit</option>
          <option value="Delivered">Delivered</option>
          <option value="Completed">Completed</option>
          <option value="Cancelled">Cancelled</option>
        </select>
        
        <input 
          type="text" 
          id="searchBox" 
          placeholder="Search by Trip ID or Location..."
          onkeyup="handleSearch()"
        >
      </div>
      
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Trip ID</th>
              <th>Date</th>
              <th>Pickup Location</th>
              <th>Delivery Location</th>
              <th>Distance</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="tripsTable">
            <tr>
              <td colspan="6" class="loading-state">Loading your trips...</td>
            </tr>
          </tbody>
        </table>
      </div>
      
      <div id="tripCount" style="margin-top: 20px; color: #666; font-size: 14px;"></div>
    </div>
  </div>
  
  <script>
    let allTrips = [];
    
    window.onload = function() {
      loadTrips();
    };
    
    function loadTrips() {
      const filterStatus = document.getElementById('statusFilter').value;
      const searchTerm = document.getElementById('searchBox').value;
      
      google.script.run
        .withSuccessHandler(function(result) {
          if (result.success) {
            allTrips = result.trips;
            displayTrips(allTrips);
          } else {
            alert('Error loading trips: ' + result.message);
          }
        })
        .withFailureHandler(function(error) {
          alert('Error: ' + error.message);
        })
        .getCustomerTrips(filterStatus, searchTerm);
    }
    
    function handleSearch() {
      loadTrips();
    }
    
    function displayTrips(trips) {
      const tripsTable = document.getElementById('tripsTable');
      const tripCount = document.getElementById('tripCount');
      
      if (trips.length === 0) {
        tripsTable.innerHTML = '<tr><td colspan="6" class="empty-state">No trips found matching your criteria</td></tr>';
        tripCount.textContent = '';
      } else {
        tripsTable.innerHTML = trips.map(trip => `
          <tr>
            <td><strong>${trip.deliveryID}</strong></td>
            <td>${trip.date}</td>
            <td>${trip.pickupLocation}</td>
            <td>${trip.deliveryLocation}</td>
            <td>${trip.distanceKm ? trip.distanceKm + ' km' : 'Pending'}</td>
            <td><span class="status-badge status-${trip.status.toLowerCase().replace(' ', '-')}">${trip.status}</span></td>
          </tr>
        `).join('');
        
        tripCount.textContent = `Showing ${trips.length} trip${trips.length !== 1 ? 's' : ''}`;
      }
    }
  </script>
</body>
</html>
