<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule Delivery - Kovilpatti Logistics</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f5f7fa;
      min-height: 100vh;
    }
    
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px 30px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    
    .header h1 {
      font-size: 24px;
    }
    
    .container {
      max-width: 800px;
      margin: 30px auto;
      padding: 0 20px;
    }
    
    .form-card {
      background: white;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    
    .form-card h2 {
      color: #333;
      margin-bottom: 30px;
    }
    
    .form-group {
      margin-bottom: 25px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
      font-size: 14px;
    }
    
    .form-group label .required {
      color: #ef4444;
    }
    
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e1e8ed;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      transition: all 0.3s;
    }
    
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }
    
    .button-group {
      display: flex;
      gap: 15px;
      margin-top: 30px;
    }
    
    .btn {
      flex: 1;
      padding: 14px 30px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
      border: none;
      text-decoration: none;
      text-align: center;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }
    
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    .btn-secondary {
      background: white;
      color: #667eea;
      border: 2px solid #667eea;
    }
    
    .btn-secondary:hover {
      background: #f8f9fa;
    }
    
    .alert {
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
    }
    
    .alert-success {
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #10b981;
    }
    
    .alert-error {
      background: #fee;
      color: #c33;
      border: 1px solid #fcc;
    }
    
    .info-box {
      background: #dbeafe;
      border-left: 4px solid #3b82f6;
      padding: 15px;
      margin-bottom: 25px;
      border-radius: 4px;
    }
    
    .info-box p {
      color: #1e40af;
      font-size: 14px;
    }
    
    @media (max-width: 768px) {
      .form-card {
        padding: 25px 20px;
      }
      
      .button-group {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>📅 Schedule New Delivery</h1>
  </div>
  
  <div class="container">
    <div class="form-card">
      <div id="alertBox"></div>
      
      <form id="deliveryForm" onsubmit="handleSubmit(event)">
        <div class="form-group">
          <label for="scheduledDate">
            Pickup Date <span class="required">*</span>
          </label>
          <input 
            type="date" 
            id="scheduledDate" 
            name="scheduledDate" 
            required
          >
        </div>
        
        <div class="form-group">
          <label for="scheduledTime">
            Pickup Time <span class="required">*</span>
          </label>
          <select id="scheduledTime" name="scheduledTime" required>
            <option value="">Select time slot</option>
            <option value="08:00 AM">08:00 AM</option>
            <option value="09:00 AM">09:00 AM</option>
            <option value="10:00 AM">10:00 AM</option>
            <option value="11:00 AM">11:00 AM</option>
            <option value="12:00 PM">12:00 PM</option>
            <option value="01:00 PM">01:00 PM</option>
            <option value="02:00 PM">02:00 PM</option>
            <option value="03:00 PM">03:00 PM</option>
            <option value="04:00 PM">04:00 PM</option>
            <option value="05:00 PM">05:00 PM</option>
            <option value="06:00 PM">06:00 PM</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="pickupLocation">
            Pickup Location <span class="required">*</span>
          </label>
          <input 
            type="text" 
            id="pickupLocation" 
            name="pickupLocation"
            placeholder="Enter full pickup address"
            required
          >
        </div>
        
        <div class="form-group">
          <label for="deliveryLocation">
            Delivery Location <span class="required">*</span>
          </label>
          <input 
            type="text" 
            id="deliveryLocation" 
            name="deliveryLocation"
            placeholder="Enter full delivery address"
            required
          >
        </div>
        
        <div class="form-group">
          <label for="itemDescription">
            Item Description <span class="required">*</span>
          </label>
          <textarea 
            id="itemDescription" 
            name="itemDescription"
            placeholder="Describe the items to be transported (e.g., 50kg rice bags, electronics items, etc.)"
            required
          ></textarea>
        </div>
        
        <div class="form-group">
          <label for="weightKg">
            Estimated Weight (kg)
          </label>
          <input 
            type="number" 
            id="weightKg" 
            name="weightKg"
            placeholder="Approximate weight in kilograms"
            min="0"
            step="0.1"
          >
        </div>
        
        <div class="form-group">
          <label for="deliveryType">
            Delivery Type <span class="required">*</span>
          </label>
          <select id="deliveryType" name="deliveryType" required>
            <option value="Standard">Standard</option>
            <option value="Express">Express</option>
            <option value="Fragile">Fragile (Handle with care)</option>
          </select>
        </div>
        
        <div class="button-group">
          <button type="button" class="btn btn-secondary" onclick="window.location.href='?page=dashboard'">
            Cancel
          </button>
          <button type="submit" class="btn btn-primary" id="submitBtn">
            Submit Booking
          </button>
        </div>
      </form>
    </div>
  </div>
  
  <script>
    // Set minimum date to today
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('scheduledDate').setAttribute('min', today);
    
    function handleSubmit(e) {
      e.preventDefault();
      
      const form = document.getElementById('deliveryForm');
      const submitBtn = document.getElementById('submitBtn');
      const alertBox = document.getElementById('alertBox');
      
      const deliveryData = {
        scheduledDate: form.scheduledDate.value,
        scheduledTime: form.scheduledTime.value,
        pickupLocation: form.pickupLocation.value,
        deliveryLocation: form.deliveryLocation.value,
        itemDescription: form.itemDescription.value,
        weightKg: form.weightKg.value || 0,
        deliveryType: form.deliveryType.value
      };
      
      submitBtn.disabled = true;
      submitBtn.textContent = 'Scheduling...';
      
      google.script.run
        .withSuccessHandler(function(result) {
          if (result.success) {
            showAlert('✅ Delivery scheduled successfully! Trip ID: ' + result.deliveryID, 'success');
            form.reset();
            setTimeout(function() {
              window.location.href = '?page=dashboard';
            }, 2000);
          } else {
            showAlert('❌ ' + result.message, 'error');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Submit Booking';
          }
        })
        .withFailureHandler(function(error) {
          showAlert('❌ Error: ' + error.message, 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Submit Booking';
        })
        .scheduleCustomerDelivery(deliveryData);
    }
    
    function showAlert(message, type) {
      const alertBox = document.getElementById('alertBox');
      alertBox.innerHTML = `
        <div class="alert alert-${type}">
          ${message}
        </div>
      `;
      window.scrollTo(0, 0);
    }
  </script>
</body>
</html>
